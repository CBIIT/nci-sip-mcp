# The behaviour the acceptance suite tests and the server implements, one entry per row of
# the acceptance tests in docs/specification.md (rendered from this file). Each has a plain
# statement and its basis: the conventions (conventions.yaml) and the tools (tools.yaml) it
# rests on. A suite test cites the ids it enforces (`@pytest.mark.requirement("X-2")`). A
# requirement not yet covered in full names the issue whose tests will cover it (`planned`):
# a citation may cover part of it, and `planned` stays until the citing tests cover all of it.
# Ids are never renumbered once merged: a removed entry leaves a gap.
# acceptance/selftests/test_requirements.py holds the rules.

# Protocol gates: once per server, before any tool test.
P-1:
  statement: In trusted-local mode tools/list names every tool of the profile under test, and no other; secured selection is tested by X-25.
  basis: [M1.2, M1.5]
P-2:
  statement: Every tool declares an outputSchema that is valid JSON Schema and covers the error record, admitting one and refusing one with a code outside its closed set or with no code.
  basis: [M3.1, error]
P-3:
  statement: No tool description, nor any description in a tool's schemas, contains placeholder, debug or development text.
  basis: [A2.4, A10.3]
P-4:
  statement: Tool names are verb-led, lowercase and underscore-separated.
  basis: [A2.1]
P-5:
  statement: In trusted-local mode tools/list, prompts/list, resources/list and resources/templates/list each carry a positive ttlMs and cacheScope public; secured hints override this under X-27.
  basis: [M2.1, M2.2]
P-6:
  statement: tools/list is the same after content calls, a release-pinned EVS call among them, and while the platform is unavailable.
  basis: [M1.2]
P-7:
  statement: A correlation identifier fully matching A6.2 is sent upstream on every platform request and returned in each item's provenance. Missing generates one; explicitly malformed, empty or non-string _meta.correlationId is invalid_request naming that field under a fresh safe identifier, with one completion audit and no rejected value in headers, errors, telemetry or logs.
  basis: [A6.2, M7.1]
P-8:
  statement: prompts/list lists exactly the prompts of spec/prompts.yaml that the profile under test has every tool of, each with its arguments as stated, and prompts/get returns messages naming, in order of first mention, exactly the tools the prompt states, in their stated order, all of them tools of the profile; resources/list lists exactly the concrete resources (URIs without a variable) and resources/templates/list exactly the URI templates of spec/resources.yaml that the profile serves. A server without the prompts or resources capability fails, even where the profile lists no prompt.
  basis: [M5.1]
P-9:
  statement: resources/read of each resource the profile serves returns JSON content in the resource's MIME type (parameters aside), compared with the answer of the tool the resource names on identity and release, not section by section; carries a provenance record with the fields X-7 requires and those spec/resources.yaml states for it, and for a caDSR resource the registry form of release; and carries ttlMs and cacheScope as fields of the result, of the class M2.2 gives what the resource holds (release-pinned content ttlMs above 0 and cacheScope public, unpinned content ttlMs above 0 and at most 3,600,000 and cacheScope public). The index manifest states its concepts, embedding and builtAt. resources/read of a URI that no listed resource or template matches is an error, never content.
  basis: [M2.1, M2.2, M2.5, A4.1, M4.1, M5.1]
P-10:
  statement: Every tool declares readOnlyHint true, destructiveHint false, idempotentHint true and openWorldHint true.
  basis: [M1.4]
P-11:
  statement: No tool description shows an operator, wildcard, filter syntax or parameter value that a tool test shows unsupported.
  basis: [A2.3, A10.3]
P-12:
  statement: Each tool takes the parameters the specification names for it, under those names, and requires exactly those not marked optional, so that equivalent operations of the two modules share parameter names.
  basis: [A2.2]

# Cross-cutting tests: against every content-returning tool.
X-1:
  statement: The release in every returned item's provenance equals the release requested.
  basis: [A3.1, A3.3]
X-2:
  statement: A request for a release the platform does not serve fails closed, with the requested-release-not-available error, or, where the platform offers no release-pinned form of the operation (A3.2), the mismatch error; and no content.
  basis: [A3.4, A3.5]
X-3:
  statement: Content the upstream serves from another release than the one requested fails closed, with the mismatch error.
  basis: [A3.4]
X-4:
  statement: A query that legitimately matches nothing returns an empty result with provenance and no nextCursor, not an error.
  basis: [A2.5, A2.6, M3.2, provenance]
X-5:
  statement: >-
    An upstream failure (a refused or closed connection, a server error, no answer in time)
    is an upstream error or a timeout, never an empty success. Call deadline exhaustion is
    upstream_unavailable, with attempts counting all outbound requests actually started
    across the call, including retries and release discovery. An ordinary request or match
    timeout that ends before the call deadline retains the timeout contract. Traversal alone
    preserves an existing verified partial graph on deadline exhaustion, reporting truncation;
    before any start node is verified it returns the deadline error.
  basis: [A2.5, A5.2, A5.4, M3.2, error, truncation]
X-6:
  statement: structuredContent validates against the tool's declared outputSchema, for successes and errors alike.
  basis: [M3.1]
X-7:
  statement: Every item carries release, source surface, retrieval time and servedBy, and, where reached by traversal, depth, relationship, direction and polarity.
  basis: [A4.1, A4.2, A4.4, provenance, traversal]
X-8:
  statement: Fields the upstream supplied appear unchanged in provenance; none is dropped or renamed.
  basis: [A4.3, provenance]
X-9:
  statement: A code is returned bare, with its terminology in a separate field; never with an embedded prefix or as a URI.
  basis: [A1.2, A1.3]
X-10:
  statement: With a caller limit smaller than the result, truncation is reported with the bound reached and the magnitude omitted.
  basis: [A5.1, A5.4, truncation]
X-11:
  statement: Within one tool call, no upstream request is made again with identical parameters, except to retry one that failed.
  basis: [A5.8]
X-12:
  statement: The licence key and the caDSR credential reach the upstream request and appear in no log, error message or result.
  basis: [A7.5]
X-13:
  statement: Every result carries in its _meta the ttlMs and cacheScope M2.2 and M2.3 give what it holds.
  basis: [M2.2, M2.3, M2.5]
X-14:
  statement: Every result is a JSON object, its lists of items named fields of it.
  basis: [M3.3]
X-15:
  statement: An upstream failure masked as a successful response (an error envelope in an HTTP 200, HTML where JSON was asked for) is an upstream error, never parsed as content. JSON nesting beyond the parser's capacity in success or error bodies is upstream_unavailable, never internal_error.
  basis: [A2.5, M3.2]
X-16:
  statement: After a 429 with Retry-After, the module waits at least that long before it asks again, and makes no request to that endpoint in between.
  basis: [A6.5, A5.3]
X-17:
  statement: A page smaller than the result carries nextCursor; following it returns the next items, repeats none of the page before, and keeps the release the first page was pinned to. Presented with any argument that differs from the first call's as applied, release and limit among them, the cursor is an invalid request; an optional argument the first call left out may be given as its default.
  basis: [M6.1, M2.4]
X-18:
  statement: A value below 1 for an argument with bounds is an invalid request, never raised to 1.
  basis: [A5.1, A2.5]
X-19:
  statement: An item of a release-pinned call carries the licence text the platform's answer gave with it, unchanged, as its attribution, and none that the platform did not give.
  basis: [A7.3, provenance]
X-20:
  statement: A call that leaves out an optional argument with a stated default returns what the call that gives the default returns.
  basis: [A5.1, M6.1]
X-21:
  statement: A caDSR content call without registryRelease names the registry form of the release with neither identifier nor date; with a registry release caDSR does not publish, it is release_not_available, never answered unpinned; with one caDSR publishes, the release is asked for and named in provenance with its date.
  basis: [A3.8, A3.4, provenance]
X-22:
  statement: >
    For NCIt content, an omitted or null release resolves the configured channel's current
    release once per call, by tag and exactly one row, or fails with release_not_available.
    Every request is pinned and every result names the effective release. Within an MCP
    session the first successfully resolved implicit release is reused, even after a content
    error; an explicit release applies only to its call and never changes that pin. A session
    release no longer served fails with release_not_available naming it and asking the caller
    to start a new session or name a release, never silently re-resolving. Other terminologies
    require an explicit release (invalid_request naming release). CLI invocations and requests
    without a session resolve per call; no process-wide default is kept. HTTP requests on
    sessionless protocol versions (2026-07-28 and later) are requests without a session,
    regardless of NCI_SIP_HTTP_SESSIONS; stdio retains its connection-local pin in both eras.
    Cursors bind the
    effective release. Completion audit records whether the release was explicit, session-held
    or freshly-resolved. Implicit NCIt calls carry ttlMs 0 and cacheScope private (M2.2);
    explicit-release calls and resources retain their existing policy. Missing, ambiguous or mismatched release identity fails closed.
  basis: [A3.1, A3.3, A3.4, A3.6.1, A3.6.2, A6.1, A2.5, M2.2, M2.3]
X-23:
  statement: An identifier that does not match the form its tool states (patterns), a release among them, is an invalid request before anything else the tool would answer, capability_unavailable included, and no upstream request carries it; an identifier without a stated form reaches the platform as one encoded path segment or parameter value. A release of that form the platform does not serve stays release_not_available (X-2).
  basis: [A7.6, A2.5]
X-24:
  statement: Free text within tools.yaml's per-field maxLength reaches the platform unchanged as one parameter value or body field, never as syntax. Each scalar's maxLength is client-visible in inputSchema and enforced before upstream or index work. Oversized text or a URL-carried text request target above 7,000 encoded bytes including filters/pins is invalid_request, never shortened; the latter error names the field and encoded size. Field descriptions state the separate URL ceiling; for caDSR it is conservative server policy, not measured capacity.
  basis: [A7.7, A2.5]

# EVS tools.
resolve_release-1:
  statement: A channel's release is resolved by its tag, never by the first row flagged latest; with a weekly and a monthly row both latest, each channel gets its own.
  basis: [resolve_release, A3.6.1, A3.6.2]
resolve_release-2:
  statement: Where one channel's query names two releases, the tool fails closed with release_not_available, naming both in details.
  basis: [resolve_release, A3.6.3, error]
resolve_release-3:
  statement: The result carries ttlMs 0.
  basis: [resolve_release, M2.2]
get_concept-1:
  statement: Each include value returns its section and no other section.
  basis: [get_concept, concept]
get_concept-2:
  statement: descendants as an include value is an invalid request.
  basis: [get_concept, error]
get_concept-3:
  statement: The concept carries code, terminology, name and active always, and status where the platform publishes one; active and status as the platform publishes them.
  basis: [get_concept, concept, A8.1, A9.1]
get_concepts-1:
  statement: A batch of codes is one upstream request.
  basis: [get_concepts, A5.8]
get_concepts-2:
  statement: A code the upstream omits is named in missing.
  basis: [get_concepts]
get_concepts-3:
  statement: The concepts come back in request order, never in the upstream's order.
  basis: [get_concepts]
search_concepts-1:
  statement: lexical search returns the platform's matches in the platform's order, a page at a time, each with the platform's highlight as matchedOn and no score, and the platform's total as totalKnown.
  basis: [search_concepts, search_result, A9.2]
search_concepts-2:
  statement: typeahead returns the platform's prefix matches in the platform's order, with neither matchedOn nor score, since the platform gives neither.
  basis: [search_concepts, search_result, A9.2]
search_concepts-3:
  statement: semantic and hybrid return concepts of the interim index, each with a score, in descending order of score, matchedOn naming the field matched (name, synonym or definition), and provenance naming the index's release, with source evs_index and servedBy index; a query equal to a concept's preferred name returns that concept on the first page. They rank every indexed concept of the terminology, with no score threshold, so totalKnown is the size of the index set; the page and the cursor bound what is returned. Local lexical candidate selection uses only the first 64 tokens in order to bound FTS work, affecting lexical/hybrid ranking only for longer sequences; vector search uses the whole query. The suite does not judge score values, the order beyond that, or which other concepts semantic search returns.
  basis: [search_concepts, search_result, provenance, M4.1]
search_concepts-4:
  statement: A mode the server cannot serve for the terminology asked is an invalid request, never an empty result.
  basis: [search_concepts, A2.5]
search_concepts-5:
  statement: semantic and hybrid for a release other than the index's fail closed with release_mismatch, never with results of the index's release.
  basis: [search_concepts, M4.1, A3.4]
search_concepts-6:
  statement: "Retired concepts are returned unless the caller asks for them alone (retired only), as the platform returns them; with only, every result is retired, by the retired status the terminology's listing names among its concept statuses; any other retired value, exclude included, is an invalid request. A8.3 is met in part, since a caller cannot ask for retired concepts to be left out, a platform dependency (A9.3) whose question is in #42."
  basis: [search_concepts, A8.3, A9.1, A9.3, A2.5]
search_concepts-7:
  statement: retired only is an invalid request for a terminology whose listing names no retired status, or names one that is not among its concept statuses, as a mode the terminology cannot be searched in is (search_concepts-4); on 2 October 2026 that is every listed terminology but NCIt.
  basis: [search_concepts, A2.5, A9.5]
search_concepts-8:
  statement: Without an index, semantic and hybrid are capability_unavailable, never an empty result. The terminology is served but its index is not there yet, unlike a mode the terminology is never searched in (search_concepts-4).
  basis: [search_concepts, M1.2, A2.5]
get_concept_hierarchy-1:
  statement: A depth above the maximum is applied as the maximum; no node is deeper, and a hierarchy that continues below it is reported as truncation by depth, with the depth applied as the limit.
  basis: [get_concept_hierarchy, node, A5.2, A5.4]
get_concept_hierarchy-2:
  statement: pathsToRoot returns every path the platform gives, each the codes from the concept to the root in the platform's order.
  basis: [get_concept_hierarchy, A9.1]
get_concept_hierarchy-3:
  statement: limit is a page that the cursor continues; the pages together hold the concepts the platform lists, in its order, none twice.
  basis: [get_concept_hierarchy, node, M6.1]
expand_value_set-1:
  statement: count and offset, which the platform ignores, select the members the tool returns, in the platform's order, and total counts them all.
  basis: [expand_value_set, member, A5.1]
expand_value_set-2:
  statement: activeOnly, which the platform ignores, leaves out the members the expansion marks inactive, and total counts those kept; when it is false or not given they are listed, marked inactive.
  basis: [expand_value_set, member, A8.3]
get_concept_neighborhood-1:
  statement: A node budget reached by one kind starves no other kind asked for that is present, and truncation.perKind names the kind that reached it.
  basis: [get_concept_neighborhood, truncation, A5.5]
get_concept_neighborhood-2:
  statement: An edge is negative exactly when its relationship's code is in the terminology's exclusion set, whatever the relationship is named.
  basis: [get_concept_neighborhood, edge, traversal, A5.7]
get_concept_neighborhood-3:
  statement: Negative edges are returned, marked, and not followed further unless includeNegative is true.
  basis: [get_concept_neighborhood, edge, A5.6]
get_concept_neighborhood-4:
  statement: A node limit above the maximum is applied as the maximum, and the truncation record's limit shows the value applied.
  basis: [get_concept_neighborhood, truncation, A5.2]
get_concept_neighborhood-5:
  statement: The outbound request bound counts retries, as the attempts of a failed request report them, and no call makes more requests than the bound. Reaching the bound is shown by no fixture, since batch sizes are each server's own; a server's own tests must show it.
  basis: [get_concept_neighborhood, get_concept_hierarchy, A5.2, A5.3]
get_concept_neighborhood-6:
  statement: budgetPerKind, when given, bounds the nodes each kind adds, and a kind that reaches it is named in truncation.perKind.
  basis: [get_concept_neighborhood, truncation, A5.5]
get_concept_subsets-1:
  statement: The subsets are the platform's Concept_In_Subset associations of the concept, each by code and name, in the platform's order.
  basis: [get_concept_subsets, subset, A9.1]
get_concept_mappings-1:
  statement: The mappings are the maps the platform carries on the concept, unchanged, in the platform's order.
  basis: [get_concept_mappings, mapping, A9.1]
get_concept_mappings-2:
  statement: targetTerminology keeps the maps whose target the platform names exactly so, case included, and no other.
  basis: [get_concept_mappings, mapping]
resolve_retired_code-1:
  statement: A retired code returns active false, the platform's status unchanged, and the replacements the platform names, by code and name with optional unchanged action/date strings from the producing row, an empty list where it names none.
  basis: [resolve_retired_code, replacement, A8.1, A8.2]
resolve_retired_code-2:
  statement: An active code returns active true, its status, and no replacement.
  basis: [resolve_retired_code, A8.1]
list_relationships-1:
  statement: Every role and association of the release's catalogue is listed, by code, name and kind.
  basis: [list_relationships, relationship, A9.1]
list_relationships-2:
  statement: A relationship is negative exactly when its code is in the terminology's exclusion set, whatever it is named.
  basis: [list_relationships, relationship, traversal, A5.7]
list_relationships-3:
  statement: For a release whose catalogue lacks a code of the exclusion set, list_relationships and get_concept_neighborhood fail closed with internal_error naming the absent codes.
  basis: [list_relationships, get_concept_neighborhood, relationship, A5.7]
list_terminologies-1:
  statement: The available terminologies are listed with their current releases, none the platform offers left out.
  basis: [list_terminologies, A7.2, terminology]

# caDSR tools.
resolve_registry_release-1:
  statement: Without a registry release upstream, published is false, generatedAt is the export's date as the export folder gives it and sourceDistribution the file it dates, with no identifier; with one, published is true and the release is returned; ttlMs 0.
  basis: [resolve_registry_release, registry_release, A3.8, M2.2]
get_data_element-1:
  statement: Each include returns its section, and without include the record's own fields alone; the data element's own version and statuses are surfaced; a version given returns that exact numeric version (4 equals 4.0), preserving the request spelling upstream and the returned version string in content and provenance. Cited items retain their own supplied identity and dates, omitted metadata stays absent and explicit null stays null. dataElementConcept contains only DEC and objectClass/property identities and dates; concepts occur only in conceptAssociations, including representationTerm. API derivations retain source order without deduplication, with primary boolean from explicit Yes/No and optional integer displayOrder, never inferred. Permissible values have own dates but no invented version; provenance is unchanged.
  basis: [get_data_element, data_element, A3.8.3]
get_data_element-2:
  statement: questionText finds the data element whose preferred question text it is; where several have it, the call is an invalid request naming their public ids, and where none has it, not_found; longName is capability_unavailable until the platform serves that lookup (OP-C02), never an empty result.
  basis: [get_data_element, M1.2, A9.3]
search_data_elements-1:
  statement: A lexical search the platform answers with its cap of 1,000 results reports truncation with bound upstream_cap, limit 1000, omitted at least 1 and exact false; totalKnown only where the platform counts; semantic and hybrid are capability_unavailable until the platform serves them (OP-C04).
  basis: [search_data_elements, truncation, A5.4, M1.2, M6.1]
search_data_elements-2:
  statement: Filters by context, workflow status, registration status and value-domain type apply. The platform's search form names no parameter for them yet (OP-C03), a platform dependency (A9.3).
  basis: [search_data_elements, A9.3]
  planned: "#42"
match_data_elements-1:
  statement: Matches are scored and rule-attributed, at most matchLimit for an entity; modelVariant and similarityThreshold are refused as an invalid request, never ignored; more entities than the tool's maximum is an invalid request; a platform slower than the match timeout is a timeout error, never an empty result.
  basis: [match_data_elements, data_element_match, A5.2, A2.5]
match_value_meanings-1:
  statement: "As match_data_elements, for value meanings and concepts: each match rule-attributed, scored where the platform scores (vmMatch does not), naming the item's type and the code system of its concept, with its crosswalk, none where the platform says NA."
  basis: [match_value_meanings, value_meaning_match, A5.2, A2.5]
get_form-1:
  statement: A form retrieved by public id returns its modules and questions, and its status unchanged, a retired one included; a supplied version compares by exact numeric value (1 equals 1.0), preserving request and upstream version spellings; a keyword is an invalid request stating that the platform needs an identifier.
  basis: [get_form, form, A8.1]
get_permissible_value-1:
  statement: Retrieval by permissible value id is capability_unavailable until the platform serves it (OP-C10, A9.3), never not_found or empty; the id the tool takes is the one caDSR REST publishes.
  basis: [get_permissible_value, permissible_value, M1.2, A9.3]
get_code_map-1:
  statement: The crosswalk is returned per data element, with the contexts and commons that use it and its coverage; a data element without value-level binding says so rather than returning no values; a source system other than CRDC is an invalid request.
  basis: [get_code_map, code_map]
list_contexts-1:
  statement: Contexts come from the registry's context names, the name its identifier; list_classification_schemes is capability_unavailable until the platform lists schemes (OP-C13), and a data element's classification schemes come as objects with their nested items.
  basis: [list_contexts, list_classification_schemes, context, classification_scheme, A7.2]

# Cross-domain tools.
find_data_elements_for_concept-1:
  statement: The data elements are those the surface named in provenance answers for the exact concept and, with expandDescendants, its descendants too; expansion requires verification of the NCIt hierarchy release. Each use preserves every distinct graph-reported objectClass, property or valueMeaning role with the actual matching conceptCode and optional trimmed integer displayOrder, canonically sorted independently of aggregate order. Missing order stays absent; malformed present order fails as upstream_unavailable. No primary flag is inferred; representation-term use is not covered by this route.
  basis: [find_data_elements_for_concept, data_element_use, A3.7]
find_data_elements_for_concept-2:
  statement: With includePermissibleValues the permissible values whose value meaning stands for the concept (or a descendant) are returned as well.
  basis: [find_data_elements_for_concept, value_use]
find_data_elements_for_concept-3:
  statement: An answer of the Shared SI Service names both graphs' identities and dates, the NCIt release in release and the registry state in registry.
  basis: [find_data_elements_for_concept, provenance, A1.5, A3.7]
find_data_elements_for_concept-4:
  statement: Only with expandDescendants is the effective release checked against the NCIt graph's, release_mismatch on a difference and release_not_available when its optional version is absent. Exact-code answers preserve both actual graph identities and dates without comparing or backfilling the optional version; missing or malformed required identities remain upstream failures. A terminology other than ncit is an invalid request.
  basis: [find_data_elements_for_concept, A3.4, A3.7]
find_data_elements_for_concept-5:
  statement: Distinct associations (publicId for elements; publicId, value, concept for values) are counted before the maximum-plus-one bound. Associations beyond the maximum are left out, with truncation saying how many at least; a sentinel alone does not establish an exact total.
  basis: [find_data_elements_for_concept, truncation, A5.4]
get_concept_for_permissible_value-1:
  statement: >-
    A data element and exact value select only the primaryIndicator Yes reference of the
    caDSR API's requested or latest item version. Agreement includes code and source
    presence/value; identical assertions collapse, missing/invalid/conflicting primary
    evidence is upstream_unavailable. Exact NCI_CONCEPT_CODE and a standalone NCIt code
    resolve to the pinned EVS concept with caDSR and EVS provenance. Otherwise return
    unresolved_pv_concept with exact code/source and caDSR-only provenance; reason precedence
    is compound_code, missing_source, non_ncit_source. No NCIt concept request for unresolved
    references; release discovery and both child permissions remain. No Shared SI graphs.
  basis: [get_concept_for_permissible_value, provenance, A1.5]
get_concept_for_permissible_value-2:
  statement: By permissibleValueId the tool is capability_unavailable (OP-C10), never not_found or empty.
  basis: [get_concept_for_permissible_value, M1.2, A9.3]
get_concept_for_permissible_value-3:
  statement: The value is compared with the data element's permissible values by exact, case-sensitive equality; a value it does not have as given, in another case or with a space around it, is not_found.
  basis: [get_concept_for_permissible_value, A7.7]
resolve_stored_value-1:
  statement: A GDC value resolves through the mapset named in each stored value's source and in evidence, confidence asserted, the release the mapset reports matching the one the call requires (release_mismatch otherwise).
  basis: [resolve_stored_value, stored_value]
resolve_stored_value-2:
  statement: Another commons' value resolves through the CRDC crosswalk, each stored value naming its data element.
  basis: [resolve_stored_value, stored_value]
resolve_stored_value-3:
  statement: A commons without a value-level binding returns no stored value, evidence saying so with its coverage and confidence none, never the preferred term as if stored.
  basis: [resolve_stored_value]
get_release_alignment-1:
  statement: Every dataset's release and date are returned with intervalDays, the largest interval in days between any two of their dates, and a warning naming maxIntervalDays exactly when intervalDays exceeds it; ttlMs 0.
  basis: [get_release_alignment, dataset_release, A3.7, M2.2]

# Workflow tools.
ground_value-1:
  statement: One provenance envelope names both content states, the release asked for and the registry, unpinned without registryRelease as X-21 reads it; EVS content of another NCIt release fails closed with the mismatch error. Exact Shared SI hops preserve both graph identities without requiring hierarchy version alignment or inventing an absent version.
  basis: [ground_value, provenance, A3.8, A3.4]
ground_value-2:
  statement: The data elements, the permissible values and, with commons, the stored values are those the surfaces answer for the concept, each hop asked by the concept; without commons there is no storedValues.
  basis: [ground_value, data_element_use, value_use, stored_value, A2.6]
ground_value-3:
  statement: A text resolves as search_concepts resolves it with its defaults, to its first result, never to a better-named one, the concept the result names.
  basis: [ground_value, search_concepts]
ground_value-4:
  statement: A hop that reaches its bound reports it in perHop, and occurred is true; since each hop is asked by the concept, the other hops are complete.
  basis: [ground_value, truncation, A5.4]
expand_cohort-1:
  statement: The codes are the concept itself and its descendants to maxDepth, less the codes an exclusion role of the concept asserts, each assertion listed in excluded; with includeNegative they stay in codes and are still listed; maxNodes counts the codes, the concept included; the result equals composing get_concept_hierarchy and get_concept_neighborhood.
  basis: [expand_cohort, A5.6]
harmonize_data_dictionary-1:
  statement: One upstream match call per column, its description as the entity's user tip; unmatched columns listed by name; each sample value aligned to the value meanings vmMatch gives; one registry state across all matches; without registryRelease the registry is unpinned, as X-21 reads it.
  basis: [harmonize_data_dictionary, data_element_match]

# Approved caller-policy contracts (ADR labels AUTH-1 through AUTH-3).
X-25:
  statement: In secured mode each verified caller sees only permitted profile tools, prompts and resources; guessed targets are refused with permission_denied before restricted reads. The catalogue is stable for fixed authority.
  basis: [M1.2, M1.6, M5.2, error]
X-26:
  statement: Compound operations preflight every argument-selected permission and recheck restricted producers before new work, including direct internal client paths; allowing a parent never grants a denied child.
  basis: [M1.6, A6.0]
X-27:
  statement: Secured responses and denials are private and no-store; each request and continuation checks current policy, expired or unavailable policy denies, and concurrent principals cannot reuse another caller's authority or session release pin.
  basis: [M1.6, M2.4, M2.6, A7.5]
X-28:
  statement: Governed HTTP rejects missing or invalid authentication and untrusted forwarded identity before MCP execution. Public health and readiness disclose status only, enforce Host admission, and forbid response caching. Required authentication cannot silently start without its approved integration.
  basis: [M1.6, M2.6, A6.0]
X-29:
  statement: Crafted returned content keeps its decoded text values exactly, appears only in data fields (and the JSON text mirror of the same result), and never appears in an error message, tool or schema description, or prompt template; every prompt states that returned content is data, never instructions. Caller prompt arguments remain caller text; server-added interpolation of upstream text is forbidden.
  basis: [A2.5, A9.1, error, M5.1]
