# The conventions binding every tool of both modules, so that a caller cannot tell from a
# response which module produced it. Each rule states what a requirement needs to be read on
# its own, and `why` gives the reason where the rule is not self-evident. The A ids are cited
# outside this repository and kept stable for that reason; the M ids are the MCP surface's
# own. Ids are never renumbered once merged.

A1:
  title: One platform, two modules
  rules:
    A1.1: A caller uses both modules in one workflow without translating identifiers, reconciling error formats or reading provenance differently.
    A1.2: A concept code is exchanged as the bare code the terminology publishes (C4817), with the terminology in a separate field; never with an embedded prefix, URI expansion or terminology punctuation as its primary form. A URI may be given as an additional field.
    A1.3: A code of the other module's domain is returned in the A1.2 form, ready to pass to the other module unchanged.
    A1.4: Neither module needs the other to be present to work.
    A1.5: Content obtained from the Shared Semantic Infrastructure Service says so in its provenance, with the release identity of both source graphs.
  why:
    A1.5: The Shared SI Service's NCIt and caDSR graphs are refreshed on independent schedules and were 89 days apart on 3 October 2026 (NCIt 26.09d of 28 September, the caDSR export of 1 July), so a result joined across them describes two content states.
A2:
  title: Tool schema conventions
  rules:
    A2.1: Tool names are verb-led, lowercase and underscore-separated, and name the object retrieved.
    A2.2: Equivalent operations of the two modules share the tool name pattern and the parameter names.
    A2.3: A tool description describes only behaviour the platform implements; it shows no unsupported operator, wildcard, filter syntax or parameter value.
    A2.4: No tool description contains placeholder, debug or development text, checked by an automated test of the rendered schema.
    A2.5: "Errors are structured, from one model that distinguishes at least: invalid request; content not found; release not available; upstream unavailable; result bound exceeded; internal error; and never resemble an empty result."
    A2.6: An empty result is distinguishable from a suppressed, truncated or failed one.
    A2.7: Where a platform serves an operation through a standard terminology interface (FHIR), it is preferred over a proprietary equivalent, and the choice is documented.
  why:
    A2.3: A model generates calls from a description; an operator the platform does not support produces a rejected call, after which the model improvises, as has been observed.
    A2.7: EVS serves FHIR R4 and R5 ($lookup, $expand, $validate-code, $subsumes, $translate); a schema on standard operations is better specified and survives a platform change. Where they fall short, as for bounded traversal over roles, the native surface is used.
A3:
  title: Release identity
  rules:
    A3.1: Every platform content request names the release explicitly. A per-call resolution or reuse of the MCP session’s implicit NCIt release pins every request of the call (X-22); a process-wide start-up default does not count.
    A3.2: Unversioned platform access is used only to discover which releases exist, and, where the platform offers no release-pinned form of an operation, to call its unpinned form, verify the release the payload reports and fail closed on a difference (the verified fallback).
    A3.3: The release in effect is recorded in the provenance of every result.
    A3.4: A cache or index derived from platform content is bound to its release; any mismatch between the release requested, the release the content reports and the release of derived content fails closed with a structured error.
    A3.5: Acceptance tests show fail-closed behaviour for each mismatch of A3.4.
    A3.6.1: The NCIt release is resolved by tag (monthly), never by the latest flag.
    A3.6.2: Monthly and weekly builds are told apart by tag, and the choice is explicit in configuration.
    A3.6.3: A release with conflicting or duplicate tags fails closed and is reported in a form fit to send upstream.
    A3.7.1: A query of the Shared SI Service reports the release identity of each graph it touched (owl:versionInfo and dc:date of the NCIt graph, dc:date of the caDSR graph) and the interval between them, and warns rather than fails when the interval exceeds a threshold (get_release_alignment's maxIntervalDays).
    A3.8.1: caDSR publishes no registry release identifier, and none is implied; a data element's version is never presented as the registry's state.
    A3.8.2: Until a registry release identifier exists, the most specific provenance the platform gives (a generation timestamp) is surfaced, and registry-level reproducibility is documented as not achievable.
    A3.8.3: Every data element is returned with its own version and registration status.
  why:
    A3.6.1: On 10 September 2026 the listing flagged two releases latest at once, the newest weekly and the newest monthly, so a client taking the first such row could request one release and receive another without an error.
A4:
  title: Provenance and citation
  rules:
    A4.1: "Every item carries its canonical identifier and, where published, its status as fields of the item, and a camelCase provenance record sufficient to reproduce, audit or discard it: at least release (terminology or registry, identifier and date), source and retrievedAt; the full record is the provenance record below."
    A4.2: An item reached by traversal adds depth, relationship (code, name, kind), direction, qualifiers, polarity and evidence.
    A4.3: Every provenance field the platform supplies is passed through, including those not listed here.
    A4.4: Provenance is attached per item, not per response.
A5:
  title: Result bounding, truncation and traversal
  rules:
    A5.1: A tool that can return a large result takes caller limits and applies a documented default.
    A5.2: >-
      Result size, traversal depth, outbound requests and elapsed time per tool call are bounded.
      NCI_SIP_CALL_DEADLINE_SECONDS sets one shared elapsed-time budget, default 50 seconds,
      validated as finite and positive with no disable switch; index operator commands are
      outside this call deadline. Release discovery and nested work share it. Checks run before
      each HTTP attempt, before each retry wait, after each body chunk and at traversal
      checkpoints. One stalled body read can overrun by at most the socket timeout chosen at
      request open, min(timeout, remaining), where timeout is NCI_SIP_TIMEOUT_SECONDS or
      NCI_SIP_MATCH_TIMEOUT_SECONDS for matching. DNS and connection setup also prevent a hard
      real-time guarantee.
    A5.3: The outbound request bound counts retries.
    A5.4: >-
      A bound reached is reported with which bound and how much was omitted, exactly or as a
      stated estimate; a flag alone is not enough. Deadline exhaustion preserves verified
      partial content for neighborhood, CLI traversal and parent/child hierarchy, with no
      nextCursor. The first actual bound stays; deadline never overwrites it. Otherwise
      truncation.bound is deadline, limit and reached are integer milliseconds, and omissions
      are lower bounds (exact false, zero when no positive minimum is known). Ask for less
      depth or fewer relationship kinds, or retry. Before any verified start, and for
      pathsToRoot, deadline exhaustion is upstream_unavailable, never partial paths.
    A5.5: Traversal over several relationship kinds does not spend its budget on one kind at the expense of another, and reports truncation per kind; a response missing a whole category of relationship says so.
    A5.6: Negative assertions are kept, marked with negative polarity and full provenance, and left out of positive expansion by default, which the caller can override.
    A5.7: Negative assertions are identified by relationship code against the release's relationship catalogue, never by the relationship's name.
    A5.8: The same information is not retrieved twice within one operation.
  why:
    A5.2: >-
      The 50-second default leaves response headroom below common 60-second client timeouts;
      weigh client and gateway timeouts before raising it. No mid-body stall has been observed;
      connection-level timeout refresh is deferred until recorded EVS/caDSR live timings show
      one, because custom HTTP/HTTPS connections add TLS-sensitive transport complexity.
    A5.7: "NCIt's exclusion relationships are exactly eight roles, R135 to R142. Matching their names fails open: a renamed label turns an exclusion into the assertion that the disease has the very finding it rules out."
A6:
  title: Audit context, correlation and telemetry
  rules:
    A6.0: The authoritative audit record, rate limits, quotas and authorisation are the platform's; the module supplies what only it knows.
    A6.1: Every tool call emits telemetry of timestamp, tool, parameters, release, outbound requests with retries, result size, truncation, response code and elapsed time.
    A6.2: A supplied _meta.correlationId is accepted only as a string fully matching [A-Za-z0-9._:-]{1,128}, recorded on every telemetry entry, passed upstream on every platform request and returned; one is generated where none is supplied. An explicitly supplied malformed, empty or non-string value is invalid_request naming _meta.correlationId, under a freshly generated safe identifier; the rejected value appears in no header, error, telemetry or log.
    A6.2a: The platform is given the audit context only the module knows (tool, consumer, workflow correlation) through the parameters or headers it defines.
    A6.2b: "Every platform request the server sends carries the User-Agent `nci-sip-mcp/<installed version> (installation=<id>; +https://github.com/CBIIT/nci-sip-mcp)`, where `installation=<id>;` is present only when `NCI_SIP_INSTALLATION_ID` is configured. The configuration and version are captured once at start-up. A configured id that is not exactly 32 lowercase hexadecimal characters, or a version that cannot form a safe label, refuses start-up with `invalid_request` naming the setting or the installed version before any platform is contacted, and the rejected value appears in no error, header or log. The label identifies the installation to platform teams; it grants no authority and neither replaces nor changes the per-call correlation identifier (A6.2)."
    A6.3: Log records share one structured format and field vocabulary across both modules.
    A6.4: Telemetry records no more content than needed, and no caller free text where a hash suffices.
    A6.5: The module does not rate-limit in place of the platform; it honours 429 and Retry-After with jittered back-off and counts retries against its budget.
  why:
    A6.2: A bounded header-safe identifier prevents header encoding failures and unbounded audit amplification; reassess header transport and audit budgets before changing its form or length.
    A6.2a: One question may cross both modules; without a shared correlation identifier the two audit trails cannot be joined.
    A6.2b: "Platform teams recognise traffic and assist its operators from their access logs, so a stable, opaque installation label belongs in the one header every client already sends; a missing label must not stop local or fixture use (owner decision 2026-11-24), but a configured value that is wrong would mislabel traffic silently, so it is refused where the operator is looking. Reassess the form with the platform teams before changing it."
A7:
  title: Identifiers, terminologies and scoping
  rules:
    A7.1: Terminology and context identifiers come from the platform's metadata at build or start-up, never hard-coded or guessed.
    A7.2: A tool lists the terminologies, contexts or classification schemes available, with identifiers and current releases.
    A7.3: Where the platform gives licence text with an item, or once with the answer that holds it, each such item carries it unchanged; the module adds none of its own.
    A7.4: A credentialed operation degrades explicitly when the credential is absent and is never presented as public.
    A7.5: A credential or licence key is sent only to the platform that issued it (the EVS licence key to EVS, the caDSR credential to caDSR) and appears in no log, error message or result.
    A7.6: An identifier that goes into an upstream path or query text (a terminology, a release, a concept code, a registry id or version) is checked before any upstream request. One with a stated form that it does not match as a whole is an invalid request; one without a stated form is sent as one percent-encoded path segment or parameter value. A release of the stated form that the platform does not serve is still not available (A3.4); the form does not replace that check.
    A7.7: Free text (a search query, a name, a description, a value) goes upstream only as one encoded parameter value or body field, never as path, parameter or query syntax, and never into a query text such as SPARQL, encoded or not. Each field's maxLength in tools.yaml counts Unicode code points and is published in inputSchema; longer input is invalid_request before upstream or index work, never shortened. URL-carried text also obeys the stated encoded-target ceiling, including filters and pins; refusal names the field and encoded byte size, and field descriptions state this separate ceiling. These caller-input bounds never truncate upstream-managed content.
    A7.8: Upstream hosts come only from configuration; no argument names or changes one.
  why:
    A7.1: A public EVS MCP server sends the terminology key loinc where EVS expects lnc, so every LOINC call answers 404, and its own tests assert the wrong value.
    A7.3: The module is a thin interface (A9.1, A9.5) and holds no stricter standard than the platform it serves. Licence text the platform does not send with the content is the platform's to send, and its absence is shown, not compensated.
    A7.6: An argument is caller input, and a model as caller can carry text it was handed; the module never lets an argument change which request it makes.
A8:
  title: Content status and retired identifiers
  rules:
    A8.1: An item's published status (retired, obsolete, provisional, pending approval) is always surfaced.
    A8.2: Replacement and history of a retired identifier are exposed, and a retired identifier never resolves silently as current.
    A8.3: How search and expansion treat retired content is documented and caller-overridable.
A9:
  title: The lean module
  rules:
    A9.1: The module is a thin interface over its platform; it returns results unmodified in substance.
    A9.2: Without a written amendment naming the capability and its owner, the module keeps no embeddings, vector or search index or persistent copy of platform content, computes no similarity, ranking or score the platform did not return, reconciles, maps or enriches nothing between the two modules' content, and derives no content (the interim NCIt index is that amendment, M4.1).
    A9.3: A capability that needs more is a platform dependency, recorded as such.
    A9.4: Request-scoped caching and caching bound to a release under A3.4 are allowed.
    A9.5: An absent platform capability is shown to the caller, never compensated for silently.
    A9.6: Reading from a governed SI service that joins or scores is allowed; the module does not own such capability, and documents the dependency's refresh cadence, service level and what it does when the service is unavailable.
  why:
    A9.6: Capability in the platform reaches every consumer, the repository backends and batch pipelines that never call a module included; inside a module it reaches only that module's callers and makes a second copy of governed content.
A10:
  title: Joint conformance and acceptance
  rules:
    A10.1: A joint conformance test spans both modules and checks A1.2, A3, A4, A5.4 and correlation propagation.
    A10.2: Where different teams own the two modules, responsibility for the joint test is assigned explicitly, and neither module's acceptance depends on the other's release schedule.
    A10.3: No tool description contains placeholder text or an unsupported operator, parameter or syntax example.
    A10.4: "Response-time criteria are relative to the platform's capability at acceptance: a module that passes a slow platform call through faithfully conforms."
A11:
  title: Performance measurement
  rules:
    A11.1: A benchmark reports, per representative scenario, release, cache state, result size, outbound calls, error rate and p50/p95 response time.
    A11.2: The benchmark reports what the platform supports and what it does not.
    A11.3: The scenarios include a workflow across both modules, measured end to end.
  why:
    A11.1: The only caDSR response-time figures in circulation come from one session in November 2025 and cannot be confirmed either way.
M1:
  title: A static, self-describing tool surface
  rules:
    M1.1: Each tool description stands alone, naming its domain, its object and how it pins a release, without reference to another tool.
    M1.2: For a fixed effective caller authority and deployment profile, the tool surface does not vary with the terminology, the release pinned or what the platform offers today; a capability not yet available is a tool returning a structured unavailable error, never an absent tool. Opt-in secured mode intersects the profile with verified caller permissions on every request; trusted-local mode retains the unrestricted profile surface.
    M1.3: Each tool's group (evs, cadsr, cross-domain, workflow) is carried in its metadata.
    # M1.4: owner decision, 2 October 2026.
    M1.4: Every tool declares the read-only annotations readOnlyHint true, destructiveHint false, idempotentHint true and openWorldHint true.
    M1.5: A server serves one profile, which selects the maximum MCP surface; caller policy may narrow it (M1.6). The profile evs serves the EVS tools, cadsr the caDSR tools, and unified all four groups; the cross-domain and workflow tools need both modules, so only unified has them (A1.4).
    M1.6: In secured mode the profile is an upper bound on exposed tools, prompts and resources. Every invocation and continuation reauthorizes from a verified identity and current immutable policy snapshot, including issuer, subject, applicable tenant/client, permissions, policy version and expiry. Missing, unavailable or expired policy fails closed. Unknown permissions grant nothing. Restricted targets, including guessed names, return permission_denied with a generic next step and correlationId, without restricted identifiers or required permissions. Compound operations check all argument-selected dependencies before restricted reads, including direct internal producer calls; new child operations cannot start after policy expiry. Upstream authorization remains authoritative.
M2:
  # Owner-approved D1-D3, Phase 6 issue 176.
  title: Caching hints
  rules:
    M2.1: tools/list, prompts/list, resources/list, resources/templates/list, resources/read and server/discover carry ttlMs and cacheScope.
    M2.2: "A result's ttlMs follows what it holds: release-pinned content 86,400,000 (long); governed content that no release pins (caDSR content while caDSR publishes no registry release) a short positive ttlMs, at most 3,600,000; a result computed from caller-supplied values (the tools marked computed in tools.yaml) 0; resolve_release, resolve_registry_release and get_release_alignment 0; a result that joins content of two states (a cross-domain or workflow result resting on release-pinned NCIt and on caDSR content) the shorter of their ttlMs. tools/list is long and public. Exception (X-22): a call that implicitly selects its NCIt release returns ttlMs 0 and cacheScope private, since its arguments do not key the effective release; explicit-release calls and resources retain their existing policy."
    M2.3: cacheScope is public for governed content, the resolve tools included, and private for results computed from caller-supplied values and for implicit NCIt release selection under M2.2.
    M2.4: A cursor pins the release it was issued against; presented after that release is superseded, it is a structured error. A cursor is never a permission grant; every page reauthorizes the caller.
    M2.5: "A tool result carries ttlMs and cacheScope in its _meta; the result of resources/read, as of the list methods, carries them as fields of the result, never in its _meta. The hint of a resource is of the class M2.2 gives what it holds, not necessarily its tool's own."
    M2.6: "In opt-in secured mode, discovery, content and denials override M2.2/M2.3 with ttlMs 0 and cacheScope private, even for explicit releases. HTTP responses carry Cache-Control: no-store, including for protocols without native cache hints. There is no shared authenticated response cache. Cursors and session identifiers never grant permissions; each request and page uses fresh authority. Already delivered content cannot be recalled."
  why:
    M2.5: The protocol carries ttlMs and cacheScope as fields of the results of the list methods, resources/read and server/discover only (revision 2026-07-28), so a tool result needs a stated place for them.
M3:
  title: Typed results
  rules:
    M3.1: Every tool declares an outputSchema covering its success and its error shape.
    M3.2: A platform failure, including one wrapped in an HTTP 200, is a result with isError; a genuine empty result has its provenance and no isError.
    M3.3: A result is a JSON object; a list of items is a named field of it, beside the cursor, the truncation and what was left out.
  why:
    M3.3: Protocol revisions before 2026-07-28 define structuredContent as an object, and a bare list leaves no place for nextCursor (M6.1), a bound reached (A5.4) or the identifiers the platform left out.
M4:
  title: The interim NCIt index
  rules:
    M4.1: NCIt semantic and hybrid search are served from a release-bound local index (the amendment A9.2 asks for) until EVS serves them. The index is re-embedded for each approved monthly release, activated and rolled back atomically, and its release is in provenance and in the index_manifest resource, from which resolve_release learns it.
M5:
  title: Prompts and resources
  rules:
    M5.1: "The furnished prompt templates are listed by prompts/list with their arguments, and the furnished resources by resources/list (a URI without a variable, a concrete resource) and resources/templates/list (a URI template, with variables); a resource carries a URI template rather than arguments. A prompt names only tools present in the profile and is listed only in a profile that has every tool it names, so the evs and cadsr profiles list none and unified lists all four (spec/prompts.yaml). A server declares the prompts and resources capabilities even where its profile lists no prompt (evs, cadsr). resources/read of a URI that no listed resource or template matches, such as a concept URI without its release, is an error, never content."
    M5.2: In secured mode a prompt is listed and rendered only when every tool it names is permitted within the profile. Resource listing and reads use the permission of their equivalent tool; templates grant no additional access. Discovery responses follow the same authority and private cache policy.
M6:
  title: Pagination
  rules:
    M6.1: Pagination is cursor-based, cursor in and nextCursor out, with totalKnown where it can be determined. A cursor continues the call it was issued for, presented with the same arguments, compared as applied (an optional argument left out equals its default given) and limit among them; with any argument that differs it is an invalid request.
M7:
  title: Correlation on the wire
  rules:
    M7.1: A caller passes its correlation identifier as correlationId in the _meta of tools/call. The module sends it upstream on every platform request the call makes, in the X-Correlation-ID header until the platform defines a parameter or header of its own (A6.2a), and returns it in the provenance of each item and in the error record.
