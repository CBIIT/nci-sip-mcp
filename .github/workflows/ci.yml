name: Pages 646 one-off verification
on:
  workflow_dispatch:
permissions: {}
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/646-hosted-verify' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      PY: /opt/hostedtoolcache/Python/3.14.10/x64/bin/python3
    steps:
      - name: Initialize evidence
        run: mkdir -p tmp/pages646-hosted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: false
      - name: Record checkout and default strict runtime
        timeout-minutes: 1
        run: |
          set -euo pipefail
          git rev-parse HEAD > tmp/pages646-hosted/checkout.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -x "$PY"
          "$PY" - <<'PYTHON' > tmp/pages646-hosted/runtime.log 2>&1
          import json
          import os
          import ssl
          import sys
          import urllib.request
          from pathlib import Path

          ctx = ssl.create_default_context()
          trust_names = {
              "SSL_CERT_FILE", "SSL_CERT_DIR", "REQUESTS_CA_BUNDLE",
              "CURL_CA_BUNDLE", "NODE_EXTRA_CA_CERTS",
          }
          overrides = sorted(k for k in os.environ if k.upper() in trust_names)
          proxies = urllib.request.getproxies()
          route_keys = sorted(proxies)
          record = {
              "executable": sys.executable,
              "python": sys.version,
              "openssl": ssl.OPENSSL_VERSION,
              "verify_paths": ssl.get_default_verify_paths()._asdict(),
              "verify_flags": int(ctx.verify_flags),
              "verify_mode": int(ctx.verify_mode),
              "check_hostname": ctx.check_hostname,
              "trust_override_names": overrides,
              "proxy_keys": route_keys,
              "identity": {k: os.environ.get(k) for k in (
                  "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_SHA",
                  "RUNNER_OS", "RUNNER_ARCH", "ImageOS", "ImageVersion",
              )},
          }
          Path("tmp/pages646-hosted/runtime.json").write_text(json.dumps(record, indent=2))
          print(json.dumps(record, indent=2))
          assert sys.flags.optimize == 0
          assert sys.version_info[:3] == (3, 14, 10)
          assert ctx.verify_mode == ssl.CERT_REQUIRED and ctx.check_hostname
          assert ctx.verify_flags & ssl.VERIFY_X509_STRICT
          assert not overrides
          assert not ({"https", "http", "all"} & set(route_keys))
          PYTHON
          gh --version > tmp/pages646-hosted/gh-version.txt
      - name: Obtain and validate exact source metadata
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          timeout 30s gh api repos/CBIIT/nci-sip-mcp/actions/runs/46149129262 > tmp/pages646-hosted/source-run.json
          timeout 30s gh api repos/CBIIT/nci-sip-mcp/actions/artifacts/15264289307 > tmp/pages646-hosted/source-artifact.json
          "$PY" - <<'PYTHON'
          import json
          from pathlib import Path

          out = Path("tmp/pages646-hosted")
          run = json.loads((out / "source-run.json").read_bytes())
          artifact = json.loads((out / "source-artifact.json").read_bytes())
          sha = "88cb67812f7ff9773b9bea364c19259d25cd0423"
          digest = "sha256:5c42eff8536594e103fc417d530edd2ac368596f12caf516d024fa8610f566f0"
          assert run["id"] == 46149129262 and run["run_attempt"] == 1
          assert run["event"] == "push" and run["head_branch"] == "main"
          assert run["head_sha"] == sha and run["conclusion"] == "success"
          assert run["status"] == "completed"
          assert run["repository"]["full_name"] == "CBIIT/nci-sip-mcp"
          assert artifact["id"] == 15264289307 and artifact["name"] == "github-pages"
          assert artifact["size_in_bytes"] == 3292265 and artifact["digest"] == digest
          assert artifact["expired"] is False
          assert artifact["workflow_run"]["id"] == 46149129262
          assert artifact["workflow_run"]["head_sha"] == sha
          assert artifact["workflow_run"]["head_branch"] == "main"
          PYTHON
          timeout 30s gh api repos/CBIIT/nci-sip-mcp/actions/artifacts/15264289307/zip > tmp/pages646-hosted/github-pages.zip
      - name: Check frozen bytes before extracting
        timeout-minutes: 1
        run: |
          set -euo pipefail
          "$PY" - <<'PYTHON' > tmp/pages646-hosted/input-check.log 2>&1
          import base64
          import hashlib
          import io
          import json
          import tarfile
          import zipfile
          from pathlib import Path

          out = Path("tmp/pages646-hosted")
          archive = (out / "github-pages.zip").read_bytes()
          assert len(archive) == 3292265
          assert hashlib.sha256(archive).hexdigest() == "5c42eff8536594e103fc417d530edd2ac368596f12caf516d024fa8610f566f0"
          with zipfile.ZipFile(io.BytesIO(archive)) as zipped:
              assert zipped.namelist() == ["artifact.tar"]
              tar_bytes = zipped.read("artifact.tar")
          assert hashlib.sha256(tar_bytes).hexdigest() == "eaaa0ff212e18dda274241b6d531aea6322de542641299c11a4830943d1d9544"
          (out / "pages-artifact.tar").write_bytes(tar_bytes)
          site = out / "site"
          site.mkdir()
          with tarfile.open(fileobj=io.BytesIO(tar_bytes)) as tar:
              tar.extractall(site, filter="data")
          build = json.loads((site / "build.json").read_bytes())
          assert build["source_commit"] == "88cb67812f7ff9773b9bea364c19259d25cd0423"
          assert build["dirty"] is False
          encoded = Path("tmp/pages646-hosted-input/verifier.b64").read_bytes()
          (out / "verifier.b64").write_bytes(encoded)
          verifier = base64.b64decode(encoded.strip(), validate=True)
          assert hashlib.sha256(verifier).hexdigest() == "cd0fb5cdad5eb6791fef80a66184c6bc4dc1338a479b5dca813f2df8bdd136e4"
          (out / "220-verify-site.py").write_bytes(verifier)
          print("Frozen ZIP, tar, build identity and unchanged verifier validated.")
          PYTHON
      - name: Execute unchanged verifier once
        timeout-minutes: 3
        run: |
          set -euo pipefail
          set +e
          "$PY" tmp/pages646-hosted/220-verify-site.py https://cbiit.github.io/nci-sip-mcp/ tmp/pages646-hosted/site 88cb67812f7ff9773b9bea364c19259d25cd0423 tmp/pages646-hosted/responses > tmp/pages646-hosted/verify.log 2>&1
          exit_code=$?
          set -e
          printf '%s\n' "$exit_code" > tmp/pages646-hosted/verifier-exit.txt
          cat tmp/pages646-hosted/verify.log
          exit "$exit_code"
      - name: Retain first-attempt evidence on failure too
        if: ${{ always() }}
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pages646-hosted-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/pages646-hosted/
          if-no-files-found: error
          retention-days: 30
