name: PR title
run-name: "Validate PR title: ${{ github.event.pull_request.title }}"

# Both landing methods use a Conventional Commit title. Merge releases follow
# the included non-merge messages, including bodies; squash releases follow the
# title with a blank body. Keep the title truthful for either method.
#
# The rule is one regular expression, so it is checked inline and not by a
# third-party action.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional:
    name: conventional commit subject
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # type(optional-scope)optional-!: subject
          # The types are `allowed_tags` of [tool.semantic_release.commit_parser_options]
          # in pyproject.toml; tests/test_release_config.py compares the two.
          pattern='^(feat|fix|perf|docs|style|refactor|test|chore|build|ci|revert|security|deprecate)(\([a-z0-9._/-]+\))?!?: .+'

          if [[ ! "$TITLE" =~ $pattern ]]; then
            # shellcheck disable=SC2016 # diagnostic examples intentionally show literal backticks
            {
              echo "## The PR title is not a Conventional Commit"
              echo
              echo '```'
              echo "$TITLE"
              echo '```'
              echo
              echo "Expected \`type(scope)?!?: subject\`, for example:"
              echo
              echo '- `feat(traversal): follow role edges in both directions`'
              echo '- `fix(index): reject a vector of another dimension`'
              echo '- `docs: describe the release pinning`'
              echo '- `feat(server)!: rename the lookup tool`'
              echo
              echo "Merge releases follow included commit messages, including bodies; squash"
              echo "releases follow the title. CONTRIBUTING.md, \"Pull requests and releases\","
              echo "lists the types and what each releases."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=The PR title is not a Conventional Commit::$TITLE"
            exit 1
          fi

          echo "OK: $TITLE"
