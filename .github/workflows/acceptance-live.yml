name: Acceptance (live)

# The acceptance suite against the live services, by hand and every Monday: a live run depends on
# the network it runs from (the EVS host may answer one IP family and not the other), so the run
# records where it ran. Live outcomes are not ratcheted; the fixture run beside them is what the
# combined per-tool report needs. The weekly run shows upstream drift: it fails when a test that
# passes on the recorded answers fails against the live service.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

concurrency:
  group: acceptance-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance-live:
    name: acceptance (live)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the package version is derived from the nearest tag
          persist-credentials: false
      - uses: $/.github/actions/setup
      # Where the run came from, and which IP family reaches EVS from there. Each probe is
      # recorded and never fails the job; no third-party service is asked for the address.
      - name: Record the network location
        env:
          EVS_URL: https://api-evsrest.nci.nih.gov/api/v1/metadata/terminologies
        run: |
          probe() {
            code="$(curl "$1" --silent --output /dev/null --max-time 10 --write-out '%{http_code}' "$EVS_URL")" \
              && echo "reached, HTTP ${code}" || echo "failed (curl exit status $?)"
          }
          {
            echo "- Runner environment: ${RUNNER_ENVIRONMENT}"
            echo "- Operating system: ${RUNNER_OS}"
            echo "- Architecture: ${RUNNER_ARCH}"
            echo "- Runner name: ${RUNNER_NAME}"
            echo "- EVS over IPv4 (curl -4): $(probe -4)"
            echo "- EVS over IPv6 (curl -6): $(probe -6)"
          } > acceptance/network.md
          { echo "### Network location"; echo; cat acceptance/network.md; } >> "$GITHUB_STEP_SUMMARY"
      # Status 1 may mean failed tests or an early stop; completion comes from the report.
      - name: Run the suite against the fixtures
        env:
          NCI_SIP_ACCEPTANCE_REGISTRY_RELEASE: required
          # The permission gates run as in CI's fixture run; without them every tool would be
          # INCOMPLETE. The step gets no secret.
          NCI_SIP_ACCEPTANCE_SECURITY_SERVER: python ../scripts/permissions_fixture.py
          NCI_SIP_ACCEPTANCE_PREPARE: 'nci-sip-mcp index-sample $(cat "$NCI_SIP_ACCEPTANCE_INDEX_CODES")'
        run: |
          status=0
          pdm run acceptance -n 4 --dist worksteal --report=fixture.json || status=$?
          if [ "$status" -gt 1 ] || [ ! -s acceptance/fixture.json ]; then
            echo "::error title=The fixture run did not finish::exit status ${status}, or no report."
            exit 1
          fi
          pdm run python -m nci_sip_acceptance.report acceptance/fixture.json --check-complete fixture
      # Credentials reach only this step, then the preparation command and server processes in
      # live mode. The harness removes inherited NCI_SIP_* settings before adding its own settings.
      # Empty and setup-placeholder values are unset before the suite sees them.
      # The summary names only absent credentials, never their values.
      - name: Run the suite against the live services
        env:
          NCI_SIP_ACCEPTANCE_MODE: live
          NCI_SIP_ACCEPTANCE_PREPARE: 'nci-sip-mcp index-sample $(cat "$NCI_SIP_ACCEPTANCE_INDEX_CODES")'
          NCI_SIP_EVS_LICENSE_KEY: ${{ secrets.NCI_SIP_EVS_LICENSE_KEY }}
          NCI_SIP_CADSR_CREDENTIAL: ${{ secrets.NCI_SIP_CADSR_CREDENTIAL }}
          CREDENTIAL_PLACEHOLDER: NCI_SIP_CONFIGURE_ME
        run: |
          absent=""
          for name in NCI_SIP_EVS_LICENSE_KEY NCI_SIP_CADSR_CREDENTIAL; do
            if [ -z "${!name}" ] || [ "${!name}" = "$CREDENTIAL_PLACEHOLDER" ]; then
              absent="$absent $name"
              unset "$name"
            fi
          done
          echo "- Credentials absent from the live run:${absent:- none}" | tee -a acceptance/network.md >> "$GITHUB_STEP_SUMMARY"
          status=0
          pdm run acceptance -n 4 --dist worksteal --report=live.json || status=$?
          if [ "$status" -gt 1 ] || [ ! -s acceptance/live.json ]; then
            echo "::error title=The live run did not finish::exit status ${status}, or no report."
            exit 1
          fi
          pdm run python -m nci_sip_acceptance.report acceptance/live.json --check-complete live
      # Drift: a test that passes on the fixtures and fails live. A test that cannot run live
      # (not_live) or is skipped there is no drift.
      - name: Compare the live outcomes with the fixture outcomes
        run: |
          status=0
          pdm run python -m nci_sip_acceptance.report acceptance/fixture.json --live acceptance/live.json --drift > acceptance/drift.md || status=$?
          { echo "### Upstream drift"; echo; cat acceptance/drift.md; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Check every anonymous Shared SI query contract
        if: ${{ !cancelled() }}
        run: |
          status=0
          pdm run python -m scripts.ssis_contracts > acceptance/ssis-contracts.json || status=$?
          { echo '### Shared SI query contracts'; echo; cat acceptance/ssis-contracts.json; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Render the combined per-tool report
        if: always()
        run: |
          if [ ! -s acceptance/fixture.json ] || [ ! -s acceptance/live.json ]; then
            echo "::warning title=No combined report::a run wrote no report."
            exit 0
          fi
          pdm run python -m nci_sip_acceptance.report acceptance/fixture.json --live acceptance/live.json > acceptance/report.md
          { echo "### Per-tool report (fixture and live)"; echo; cat acceptance/report.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: acceptance-live
          path: |
            acceptance/fixture.json
            acceptance/live.json
            acceptance/report.md
            acceptance/network.md
            acceptance/drift.md
            acceptance/ssis-contracts.json
          if-no-files-found: warn
          retention-days: 30
