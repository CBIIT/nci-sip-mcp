name: Set up the project
description: >-
  Python 3.14 and PDM, and the environment pdm.lock pins. The caller checks the repository out
  first, with its full history: the package version is derived from the nearest tag.
inputs:
  release-only:
    description: Install only locked release tooling, without the project
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      id: py
      with:
        python-version: "3.14"
    # setup-pdm exported this for the Linux callers; it persists into the later steps.
    - name: Preload the compiler runtime
      if: runner.os == 'Linux'
      shell: bash
      run: echo "LD_PRELOAD=/lib/x86_64-linux-gnu/libgcc_s.so.1" >> "$GITHUB_ENV"  # zizmor: ignore[github-env]
    # PDM and its closure come from the tracked, hash-pinned requirements file, kept apart from
    # pdm.lock, which governs the project environment. The executable is published only after the
    # install, `pip check` and the version check have succeeded.
    - name: Install PDM from hashed requirements
      env:
        PDM_HOME: ${{ runner.temp }}/pdm-tool
        PIP_UPLOADED_PRIOR_TO: P5D
        PIP_LOG: ${{ runner.temp }}/pdm-bootstrap-pip.log
      shell: bash
      # The only value written to GITHUB_PATH is this step's own runner-temp directory, and only
      # after the hashed install, pip check and version check have passed.
      run: |  # zizmor: ignore[github-env]
        requirements="$GITHUB_ACTION_PATH/../../../container/pdm-bootstrap-requirements.txt"
        python -m venv "$PDM_HOME/venv"
        "$PDM_HOME/venv/bin/python" -m pip install --require-hashes --only-binary :all: --no-deps -r "$requirements"
        "$PDM_HOME/venv/bin/python" -m pip check
        expected="$(sed -n 's/^pdm==\([^ ]*\) .*/\1/p' "$requirements")"
        test -n "$expected"
        "$PDM_HOME/venv/bin/pdm" --version | grep -Fx "PDM, version $expected"
        mkdir -p "$PDM_HOME/bin"
        ln -sf ../venv/bin/pdm "$PDM_HOME/bin/pdm"
        echo "$PDM_HOME/bin" >> "$GITHUB_PATH"
    - name: Verify PDM tool environment
      env:
        PDM_TOOL_HOME: ${{ runner.temp }}/pdm-tool
      shell: bash
      run: |
        "$PDM_TOOL_HOME/venv/bin/python" - <<'PYTHON'
        import json
        import os
        from importlib.metadata import PackageNotFoundError, distributions, version
        from pathlib import Path
        import shutil
        import sys

        home = Path(os.environ["PDM_TOOL_HOME"])
        selected = shutil.which("pdm")
        if Path(sys.prefix).resolve() != (home / "venv").resolve():
            raise SystemExit("Unexpected PDM tool interpreter")
        if selected is None or Path(selected).resolve() != (home / "bin/pdm").resolve():
            raise SystemExit("Unexpected PDM executable")
        expected: dict[str, str] = {
            "pdm": "2.29.2",
            "hishel": "1.2.1",
            "unearth": "0.18.2",
            "virtualenv": "21.15.2",
        }
        for name, required in expected.items():
            try:
                installed = version(name)
            except PackageNotFoundError:
                raise SystemExit("Missing PDM tool distribution") from None
            if installed != required:
                raise SystemExit("Unsupported PDM tool distribution")
        print(json.dumps(sorted((item.metadata["Name"], item.version) for item in distributions())))
        PYTHON
    - name: Record bootstrap pip versions
      env:
        PDM_TOOL_HOME: ${{ runner.temp }}/pdm-tool
        PDM_TOOL_PIP_LOG: ${{ runner.temp }}/pdm-bootstrap-pip.log
      shell: bash
      run: |
        "$PDM_TOOL_HOME/venv/bin/python" - <<'PYTHON'
        import json
        import os
        import re
        from pathlib import Path

        versions = []
        try:
            source = Path(os.environ["PDM_TOOL_PIP_LOG"]).open()
        except FileNotFoundError:
            raise SystemExit("Missing bootstrap pip version evidence") from None
        with source:
            for line in source:
                if " Using pip " not in line:
                    continue
                match = re.search(
                    r" Using pip ([0-9]+(?:\.[0-9]+)+) from .+ \(python [0-9]+\.[0-9]+\)\s*$",
                    line,
                )
                if match is None:
                    raise SystemExit("Unrecognized bootstrap pip version evidence")
                versions.append(match.group(1))
        if not versions:
            raise SystemExit("Incomplete bootstrap pip version evidence")
        print(json.dumps(versions))
        PYTHON
    - name: Locate PDM caches
      if: inputs.release-only != 'true'
      id: pdm-paths
      shell: bash
      run: |
        cache_dir="$(pdm config cache_dir)"
        venv_location="$(pdm config venv.location)"
        echo "cache-dir=$cache_dir" >> "$GITHUB_OUTPUT"
        echo "venv-location=$venv_location" >> "$GITHUB_OUTPUT"
    # An environment built from another lock file may hold packages this one dropped, so the key
    # is exact, its prefix cannot match an old setup-pdm cache, and there is no restore-keys. A miss or a failed save only costs time.
    - if: inputs.release-only != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |-
          .venv
          __pypackages__
          ${{ steps.pdm-paths.outputs.cache-dir }}
          ${{ steps.pdm-paths.outputs.venv-location }}
        key: pdm-bootstrap-v1-${{ runner.os }}-${{ runner.arch }}-python-${{ steps.py.outputs.python-version }}-${{ hashFiles('pdm.lock') }}
    # --check fails on a lock file that no longer matches pyproject.toml.
    - if: inputs.release-only != 'true'
      run: pdm install --check
      shell: bash
    - if: inputs.release-only == 'true'
      run: |
        pdm lock --check
        pdm sync --no-default --no-self -G release --without server --without index
      shell: bash
